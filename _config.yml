title: ParleHub
# Must match CNAME. jekyll-sitemap stamps this onto every <loc> in sitemap.xml and
# onto the Sitemap: line in robots.txt, so a mismatch publishes a sitemap of URLs
# that all 301, which Search Console reports as "Page with redirect".
url: "https://parlehub.com"
baseurl: ""
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
timezone: America/New_York

# Never published. Jekyll copies any unrecognised root file into _site, so internal
# docs must be listed here or they end up served at parlehub.com/<path>.
# (Directories starting with "_" or "." are already ignored; the entries below are
# explicit so the intent survives a rename.)
exclude:
  - CLAUDE.md
  # The marketing workspace moved to the private parlehub/marketing repo on
  # 2026-08-14. Both spellings stay listed as a guard: if that repo is ever
  # cloned or copied in here, a directory without the leading underscore would
  # otherwise be published straight to parlehub.com.
  - _marketing/
  - marketing/
  - .claude/
  - test.html
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-sitemap
  # Generates stub pages at the old /security.html style URLs that forward to the
  # current /security/ ones. Driven by `redirect_from:` in each page's front matter.
  - jekyll-redirect-from

collections:
  posts:
    output: true

defaults:
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: blog
      section: blog
