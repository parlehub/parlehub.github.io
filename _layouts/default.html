<!doctype html>
<html class="dark" lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-K1NCXZH6M5"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-K1NCXZH6M5");
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
      {% if page.title %}{{ page.title }} | ParleHub{% else %}ParleHub{% endif
      %}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: 'ParleHub blog: product updates, security notes, and team AI collaboration insights.' }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/assets/tailwind.config.js"></script>
    <link href="/assets/site.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/images/grad-215x215.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  </head>
  <body class="font-body selection:bg-primary/30 selection:text-parchment">
    <header
      class="w-full max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop py-6 flex items-center justify-between"
      id="main-header"
    >
      <a href="/" class="flex items-center space-x-3 group">
        <div
          class="w-9 h-9 rounded-lg bg-gradient-to-tr from-[#005ac2] via-[#4d8eff] to-[#adc6ff] flex items-center justify-center shadow-lg transition-transform duration-300 group-hover:scale-105"
        >
          <svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            ></path>
          </svg>
        </div>
        <span
          class="font-display font-semibold text-lg tracking-tight text-parchment group-hover:text-primary transition-colors"
          >ParleHub</span
        >
      </a>

      <nav class="hidden md:flex items-center gap-8">
        <a
          href="/security.html"
          class="text-sm {% if page.nav == 'security' %}text-parchment{% else %}text-parchment-dim hover:text-parchment{% endif %} transition-colors"
          >Security</a
        >
        <a
          href="/pricing.html"
          class="text-sm {% if page.nav == 'pricing' %}text-parchment{% else %}text-parchment-dim hover:text-parchment{% endif %} transition-colors"
          >Pricing</a
        >
        <a
          href="/blog/"
          class="text-sm {% if page.nav == 'blog' %}text-parchment{% else %}text-parchment-dim hover:text-parchment{% endif %} transition-colors"
          >Blog</a
        >
      </nav>

      <div class="flex items-center gap-4 md:gap-6">
        <a
          href="https://app.parlehub.com"
          class="hidden sm:inline text-sm text-parchment-dim hover:text-parchment transition-colors"
          >Sign in</a
        >
        <a
          href="https://app.parlehub.com"
          class="h-10 px-5 inline-flex items-center rounded-lg bg-primary text-ink font-semibold text-sm hover:bg-primary-bright transition-colors"
        >
          Start free
        </a>
      </div>
    </header>

    <div
      class="md:hidden flex items-center justify-center gap-6 pb-4 -mt-2 border-b border-ink-line/40"
    >
      <a
        href="/security.html"
        class="text-sm {% if page.nav == 'security' %}text-parchment{% else %}text-parchment-dim hover:text-parchment{% endif %} transition-colors"
        >Security</a
      >
      <a
        href="/pricing.html"
        class="text-sm {% if page.nav == 'pricing' %}text-parchment{% else %}text-parchment-dim hover:text-parchment{% endif %} transition-colors"
        >Pricing</a
      >
      <a
        href="/blog/"
        class="text-sm {% if page.nav == 'blog' %}text-parchment{% else %}text-parchment-dim hover:text-parchment{% endif %} transition-colors"
        >Blog</a
      >
      <a
        href="https://app.parlehub.com"
        class="text-sm text-parchment-dim hover:text-parchment transition-colors"
        >Sign in</a
      >
    </div>

    <main class="relative">{{ content }}</main>

    <footer class="w-full border-t border-ink-line/60" id="main-footer">
      <div
        class="max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop py-16 space-y-12"
      >
        <div class="text-center py-4 border-y border-ink-line/40">
          <p class="eyebrow text-primary-dim">
            Works with Anthropic &middot; OpenAI &middot; Google Gemini &middot;
            Azure OpenAI
          </p>
        </div>
        <div
          class="flex flex-col sm:flex-row items-center justify-between gap-6 text-xs text-parchment-dim/70"
        >
          <div class="flex items-center gap-2.5">
            <div
              class="w-6 h-6 rounded-md bg-gradient-to-tr from-[#005ac2] via-[#4d8eff] to-[#adc6ff] flex items-center justify-center"
            >
              <svg
                class="w-3.5 h-3.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                ></path>
              </svg>
            </div>
            <span class="font-mono">© 2026 ParleHub</span>
          </div>
          <nav
            class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2"
          >
            <a
              href="/security.html"
              class="hover:text-parchment transition-colors"
              >Security</a
            >
            <a
              href="/pricing.html"
              class="hover:text-parchment transition-colors"
              >Pricing</a
            >
            <a href="/blog/" class="hover:text-parchment transition-colors"
              >Blog</a
            >
            <a href="/terms.html" class="hover:text-parchment transition-colors"
              >Terms</a
            >
            <a
              href="/privacy.html"
              class="hover:text-parchment transition-colors"
              >Privacy</a
            >
            <button disabled type="button" class="cursor-not-allowed">
              Contact
            </button>
          </nav>
        </div>
      </div>
    </footer>
  </body>
</html>
